name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      # dist/ and src/generated.js are committed, because tools install straight from GitHub.
      - name: The built files are up to date
        run: |
          git diff --exit-code dist src/generated.js
          test -z "$(git status --porcelain dist src/generated.js)"
      - run: npm run site:build
      - run: npm run check
      # After the site build, so the tests also check the built docs site.
      - run: npm test
      - name: Accessibility (axe), the docs site
        run: npm run site:axe
      - name: The starter, as a tool would use it (install, check, build, test, axe)
        run: node build/try-starter.mjs
      - name: Lighthouse, the docs site
        if: github.ref == 'refs/heads/main'
        run: npx --yes @lhci/cli@0.16 autorun --config=lighthouserc.cjs --collect.staticDistDir=site/dist

  # Every push to main that passes the checks goes live on style.eurth.org.
  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Deploy to style.eurth.org
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run site:deploy
      - name: Skip without a token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::No CLOUDFLARE_API_TOKEN secret, so nothing was deployed. See README, Deployment."
