# style.eurth.org lists the tools that have launched, so it is rebuilt each night, just after
# midnight in Brussels, and deployed if the build differs from what is live.
name: Docs site nightly

on:
  schedule:
    - cron: '10 23 * * *'
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - run: npm test
      - name: Has anything changed?
        id: state
        run: |
          if curl -fsS --max-time 20 https://style.eurth.org/sw.js -o live-sw.js && cmp -s live-sw.js site/dist/sw.js; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::style.eurth.org already serves this build."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.state.outputs.deploy == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --config site/wrangler.jsonc
