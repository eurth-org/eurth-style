# A release: push a tag vX.Y.Z that matches package.json. This checks everything once more,
# publishes the GitHub release, and moves the v1 tag, which is what the tools' workflows call
# (tool-ci.yml@v1). Tools pick the release up on their next nightly run.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build
      - name: The built files are up to date
        run: git diff --exit-code dist src/generated.js
      - run: npm run site:build
      - run: npm run check
      - run: npm test
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "@eurth/style ${GITHUB_REF_NAME#v}" --notes "What this release adds is in [roadmap.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/roadmap.md)." --verify-tag
      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major"
          git push -f origin "refs/tags/$major"
